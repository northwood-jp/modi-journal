name: publish-journal

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 22 * * 1,3,5'   # 日本時間 火・木・土の朝7時
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 必要な部品を入れる
        run: pip install pillow requests numpy
      - name: 下書きシートから記事を取り込む
        env:
          GAS_URL: ${{ secrets.GAS_URL }}
          GAS_TOKEN: ${{ secrets.GAS_TOKEN }}
        run: python fetch_posts.py
      - name: サイトを作る
        run: python build.py
      - name: 記事とトップ画像を保存する
        run: |
          git config user.name "modi-bot"
          git config user.email "modi-bot@users.noreply.github.com"
          git add posts images || true
          git diff --cached --quiet || (git commit -m "記事を取り込み [skip ci]" && git push)
      - name: スプレッドシートに知らせる
        env:
          GAS_URL: ${{ secrets.GAS_URL }}
          GAS_TOKEN: ${{ secrets.GAS_TOKEN }}
        run: python notify_posts.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
