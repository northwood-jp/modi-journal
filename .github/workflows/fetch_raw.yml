name: fetch_raw
# raw_fetch.txt に「商品ID 画像URL」を書いてpushすると、その商品の写真1〜6を raw/商品ID/ に取ってくる（コーデ組み立て用）
on:
  push:
    paths: ['raw_fetch.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow numpy scipy requests "rembg[cpu]"
      - run: |
          python - <<'P'
          import coords
          for line in open('raw_fetch.txt'):
              p = line.split()
              if len(p) == 2:
                  coords.prepare_raw({'hatId': p[0], 'hatImg': p[1]})
          P
      - run: |
          git config user.name modi-bot; git config user.email modi-bot@users.noreply.github.com
          git add raw && git commit -qm "raw photos [skip ci]" && git pull -q --rebase && git push -q || echo nothing
